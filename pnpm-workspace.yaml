packages:
  - .

# Reproducible manifests and a fail-closed dependency graph. The lockfile remains the exact build
# input; these settings also constrain future `pnpm add` / lockfile refreshes.
savePrefix: ''
strictPeerDependencies: true
peerDependencyRules:
  # eslint-plugin-jsx-a11y 6.10.2 works under the repository's green ESLint 10 lint suite but its
  # peer range has not yet been widened past ESLint 9. Keep the exception package-specific.
  allowedVersions:
    'eslint-plugin-jsx-a11y>eslint': '10'
engineStrict: true
nodeVersion: 24.15.0
minimumReleaseAge: 1440
blockExoticSubdeps: true

# Dependency lifecycle scripts are code execution during install. Esbuild's platform-binary check
# is required; donation messages and protobuf's optional postinstall are explicitly denied. Any
# new package that adds an unreviewed install script fails instead of silently executing it.
allowBuilds:
  esbuild: true
  core-js: false
  protobufjs: false

# Floors for transitive packages with published advisories the parents haven't picked up yet
# (OSV: fast-uri GHSA-4c8g-83qw-93j6/GHSA-v2hh-gcrm-f6hx/GHSA-jqff-g426-hqxp,
# browserslist GHSA-c83g-rgw3-j3cx, js-yaml GHSA-52cp-r559-cp3m,
# dompurify GHSA-p98j-92pf-mc4p, undici GHSA-w293-vg96-wgc3 and related 7.29.1 fixes,
# protobufjs GHSA-j3f2-48v5-ccww,
# brace-expansion GHSA-q2hr-2g5m-vwhr, postcss GHSA-r28c-9q8g-f849,
# smol-toml GHSA-r4xh-jqrq-34v2, source-map-js GHSA-68fv-2mgg-jv7q).
overrides:
  protobufjs: ^7.6.5
  undici: ^7.29.1
  fast-uri: ^3.1.8
  browserslist: ^4.28.8
  js-yaml: ^4.3.2
  dompurify: ^3.4.16
  brace-expansion@1: ^5.0.12
  brace-expansion@5: ^5.0.12
  postcss: ^8.5.18
  smol-toml: ^1.9.0
  source-map-js: ^1.2.2

# Bound brace/parenthesis AST depth until braces publishes a fix for GHSA-vfj7-8cjw-p6xm.
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
