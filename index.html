<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Content-Security-Policy — defense-in-depth behind the app's input sanitization. It
      allow-lists exactly the origins Mavéa uses, so even if markup ever slipped past the
      sanitizers it could neither load a script nor exfiltrate to an attacker origin.
        script-src   self + wasm-unsafe-eval (Silero VAD / onnx WASM). Shiki, jsPDF,
                     modern-screenshot, mediabunny, and pdf.js are ordinary bundled dependencies
                     (self-hosted, code-split, dynamic import()) — they need no CDN allowance.
        style-src    'unsafe-inline' is required — React inline styles + the design-system CSS vars
        connect-src  self covers the same-origin /llm·/tts·/stt·/search·/pdf·/actions proxies and
                     VAD's same-origin assets; the provider + Wikipedia hosts cover a direct baseUrl;
                     api.github.com
                     covers Ripple's read-only, browser-direct GitHub intake (public repos keyless,
                     private with the user's own token). It ALSO has to repeat every image host
                     below: the raster export (modern-screenshot) inlines a cross-origin image by
                     fetch()ing it, so a host that img-src can paint but connect-src cannot fetch
                     renders on screen and then comes out BLANK in the exported PDF/PPTX — which is
                     how map tiles and photos silently vanished from exports. No new trust: these
                     origins are already trusted to paint pixels.
        img-src      data:/blob: (object-URL images) + reviewed Wikimedia files / map tiles
        media-src    blob: — Kokoro TTS WAV plays from an object URL
        worker-src   blob: — the VAD / onnx worker
        frame-src    self — the PDF reader may frame a same-origin PDF/proxy URL; its render
                     boundary rejects every external or active-scheme frame source
      This meta tag is the ONE place the policy is defined, so it travels with the app to any static
      host. `frame-ancestors` is the one directive a meta tag cannot carry — send it as a response
      header (X-Frame-Options / CSP frame-ancestors) from whatever actually serves dist/.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://upload.wikimedia.org https://tiles.openfreemap.org; connect-src 'self' https://en.wikipedia.org https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://openrouter.ai https://api.x.ai https://api.github.com https://api.search.brave.com https://api.tavily.com https://upload.wikimedia.org https://tiles.openfreemap.org; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Mavéa · Talk to AI. See what it means.</title>
    <meta
      name="description"
      content="Mavéa is a voice-first AI presence. Talk to it and watch the answer appear as charts, timelines, and maps — running locally, with your own API key."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Self-hosted fonts (public/fonts, OFL): no third-party request, and the app works offline.
         Preload only the compact UI face. Newsreader is display:swap and loads at normal priority;
         preloading its 129 kB variable file competed with the shell on constrained connections. -->
    <link
      rel="preload"
      href="/fonts/hanken-grotesk-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Boot splash — painted straight from this static document, so a slow connection or an old
         machine sees Mavéa's pulsing orb instead of a blank white page while the bundle downloads
         and parses. Root() removes #boot on its first commit (src/main.tsx); if the bundle never
         arrives the splash simply stays, which beats a blank page. The CSP above allows inline
         STYLE but no inline script, so this block is the only boot-time styling possible — the
         stored theme choice (localStorage, src/lib/theme.ts) can't be read before that first
         paint either. Colors are literals because no token CSS has loaded yet; each mirrors its
         token: #f3f5fb = light --surface-default (light-theme.css — light is the documented
         startup default, theme.ts, and <html> above carries data-theme="light" so this paints
         correctly before any script runs), #0a0e15 = dark --surface-default (tokens-base.css),
         #6e8cff = --presence. The orb copies SurfaceFallback's (rootBoundary.css) exactly, so the
         splash → React hand-off is invisible. -->
    <style>
      #boot {
        position: fixed;
        inset: 0; /* full-viewport cover — zero layout shift when it is removed */
        z-index: 9997; /* one under SurfaceFallback (9998) so React's own loading UI wins */
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface-default, #f3f5fb);
      }
      /* Pre-mount guess for a returning dark-mode reader: with no inline script to consult
         localStorage before this first paint, prefers-color-scheme is the only theme signal CSS
         has that early, so it stands in for "the stored choice is dark" (the two correlate for
         the overwhelming majority of readers — this app's toggle doesn't otherwise follow system
         preference, see theme.ts). The plain #boot selector here is deliberately LESS specific
         than the :root[data-theme='dark'] rule below, so the instant applyTheme stamps a
         confirmed dark choice onto <html> (module scope, before React renders) that rule takes
         over with no discontinuity — same color either side of the handoff. A reader whose
         *explicit* choice is light while their system sits in dark mode is the one case this
         guess gets wrong; <html> ships data-theme="light" statically (below) so that value is
         indistinguishable, pre-boot, from a real confirmed choice — there's no way to tell "not
         yet known" from "explicitly light" without the inline script the CSP forbids. That
         reader sees the dark guess for the short module-eval window before Root() removes #boot,
         never longer. */
      @media (prefers-color-scheme: dark) {
        #boot {
          background: var(--surface-default, #0a0e15);
        }
      }
      /* applyTheme stamps data-theme at module scope, before React renders — a returning DARK
         reader is corrected the instant the bundle executes, not at first paint. */
      :root[data-theme='dark'] #boot {
        background: var(--surface-default, #0a0e15);
      }
      /* …and it also stamps data-theme-resolved, which is what tells a REAL light choice apart
         from the static default above. The moment it lands, the guess above is overruled — so the
         reader who keeps a light app on a dark system sees the guess only until the bundle
         executes, and never after. */
      :root[data-theme-resolved][data-theme='light'] #boot {
        background: var(--surface-default, #f3f5fb);
      }
      .boot-orb {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: radial-gradient(
          circle at 35% 30%,
          color-mix(in oklab, #6e8cff 70%, white 12%),
          #6e8cff
        );
        /* opacity + scale only — compositor-cheap even on the weakest hardware */
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.85);
          opacity: 0.6;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-orb {
          animation: none;
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-busy="true" aria-label="Loading Mavéa">
      <div class="boot-orb" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
