name: Release

# "Cut a release" = run this workflow (Actions tab → Run workflow, or `gh workflow run release.yml
# -f bump=patch`). Pick patch/minor/major; everything else — bumping package.json, committing,
# tagging, creating the GitHub Release, verifying, and publishing to npm — happens automatically
# in one run. No standing bot PR, no manual package.json edits.
#
# The `release: published` trigger stays as a manual fallback: if you ever tag + publish a GitHub
# Release yourself outside this workflow (version already bumped by hand), it still verifies the
# tag matches package.json and publishes.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump size
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  cut-release:
    name: Bump version · tag · create GitHub Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Require reviewed PolyForm release terms
        run: node scripts/check-release-policy.mjs
        env:
          MAVEA_LEGAL_RELEASE_APPROVED: ${{ vars.MAVEA_LEGAL_RELEASE_APPROVED }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Bump package.json version
        id: tag
        run: |
          pnpm version "${{ inputs.bump }}" --no-git-tag-version
          # Read the bumped version back from package.json itself rather than parsing pnpm's
          # stdout — pnpm's "Version bumped successfully: <name>: <old> → <new>" summary format
          # is not a stable contract (it broke this exact parse once already) and package.json is
          # the actual source of truth the rest of this workflow already checks against.
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "tag_name=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): ${{ steps.tag.outputs.tag_name }}"
          git tag "${{ steps.tag.outputs.tag_name }}"
          git push origin main "${{ steps.tag.outputs.tag_name }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.tag.outputs.tag_name }}" --generate-notes

  publish:
    name: Verify · Publish to npm
    needs: cut-release
    # Runs whether we just cut the release above, or someone published a GitHub Release directly.
    if: |
      always() &&
      (github.event_name == 'release' || needs.cut-release.result == 'success')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.cut-release.outputs.tag_name || github.event.release.tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Tag must match package.json version
        # Only meaningful on the release:published fallback path — cut-release always keeps them
        # in sync by construction.
        run: |
          TAG="${{ needs.cut-release.outputs.tag_name || github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag $TAG (version $TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Require reviewed PolyForm release terms
        run: pnpm check:release-policy
        env:
          MAVEA_LEGAL_RELEASE_APPROVED: ${{ vars.MAVEA_LEGAL_RELEASE_APPROVED }}

      # The full test suite, lint/typecheck, knip, license gate, vulnerability audit, and the
      # cross-browser Playwright matrix all already ran against this exact code on `main`'s own CI
      # (ci.yml) before this commit could exist — cut-release only adds a version-bump commit on
      # top. Re-running the whole app behind a fresh checkout re-proves things already proven for a
      # diff that's just a version string. This job now only re-checks what's actually NEW about a
      # release: the tag/version pairing, legal policy sign-off, and the shape of the tarball that
      # is about to be published. There is currently no automated gate ensuring `main`'s CI was
      # green before a release is cut — workflow_dispatch can fire against a red or in-flight
      # commit — so that's on the releaser to check by eye for now.
      - name: Build
        run: pnpm exec vite build

      - name: Public artifact boundary
        run: pnpm check:artifact

      - name: Package artifact shape (packs exactly what npm would receive)
        run: pnpm check:package

      - name: Publish to npm
        # No --provenance: npm only accepts a provenance attestation from a PUBLIC source repo
        # (it rejects the Sigstore bundle outright otherwise), and this repo is intentionally
        # private. Package visibility on npm is unaffected either way — this only drops the
        # verified-build badge on the npm package page.
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          MAVEA_LEGAL_RELEASE_APPROVED: ${{ vars.MAVEA_LEGAL_RELEASE_APPROVED }}
