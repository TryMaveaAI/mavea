name: Release

# "Cut a release" = run this workflow (Actions tab → Run workflow, or `gh workflow run release.yml
# -f bump=patch`). Pick patch/minor/major; everything else — bumping package.json, committing,
# tagging, creating the GitHub Release, verifying, and publishing to npm — happens automatically
# in one run. No standing bot PR, no manual package.json edits.
#
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump size
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  cut-release:
    name: Bump version · tag · create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Require reviewed PolyForm release terms
        run: node scripts/check-release-policy.mjs
        env:
          MAVEA_LEGAL_RELEASE_APPROVED: ${{ vars.MAVEA_LEGAL_RELEASE_APPROVED }}

      - name: Require green CI on the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status completed --limit 1 --json conclusion --jq '.[0].conclusion // "missing"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for $GITHUB_SHA is $conclusion; release only an exact green source commit"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Bump package.json version
        id: tag
        run: |
          pnpm version "${{ inputs.bump }}" --no-git-tag-version
          # Read the bumped version back from package.json itself rather than parsing pnpm's
          # stdout — pnpm's "Version bumped successfully: <name>: <old> → <new>" summary format
          # is not a stable contract (it broke this exact parse once already) and package.json is
          # the actual source of truth the rest of this workflow already checks against.
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "tag_name=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): ${{ steps.tag.outputs.tag_name }}"
          git tag "${{ steps.tag.outputs.tag_name }}"
          git push origin main "${{ steps.tag.outputs.tag_name }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.tag.outputs.tag_name }}" --generate-notes

  publish:
    name: Verify · Publish to npm
    needs: cut-release
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.cut-release.outputs.tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Tag must match package.json version
        # Re-check the boundary in the second job rather than trusting the hand-off tag blindly.
        run: |
          TAG="${{ needs.cut-release.outputs.tag_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag $TAG (version $TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Require reviewed PolyForm release terms
        run: pnpm check:release-policy
        env:
          MAVEA_LEGAL_RELEASE_APPROVED: ${{ vars.MAVEA_LEGAL_RELEASE_APPROVED }}

      # The full test suite, lint/typecheck, dependency policy, and security scans ran against the
      # exact source commit required by cut-release. Its only new commit is the generated version
      # bump, so this job rebuilds and verifies the actual package rather than repeating every app
      # test on an unchanged implementation.
      - name: Build
        run: pnpm exec vite build

      - name: Public artifact boundary
        run: pnpm check:artifact

      - name: Package artifact shape (packs exactly what npm would receive)
        run: pnpm check:package

      - name: Publish to npm
        # Public scoped packages are available on npm's free plan. npm 11.5.1+ exchanges this
        # GitHub-hosted job's short-lived OIDC identity through the configured trusted publisher;
        # no standing publish token exists. Trusted publishing adds provenance automatically.
        run: npm publish --access public
        env:
          MAVEA_LEGAL_RELEASE_APPROVED: ${{ vars.MAVEA_LEGAL_RELEASE_APPROVED }}
