name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - 'docs/**'
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore: *docs-only
  # Forward-compatibility sweep (see the node-next job): the toolchain requires Node 24+, and
  # re-running every gate on a second Node version per push bought no signal a browser-asset app
  # can use. Once a week is the right cadence for "does the toolchain still build on Node 26".
  schedule:
    - cron: '0 6 * * 1'

# Cancel superseded PR runs to save minutes, but NEVER cancel a push to main — a quick second
# push must not kill the first run (and its uploaded artifact) mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; each job re-declares exactly what it needs.
permissions:
  contents: read

# Actions are pinned to a commit SHA (supply-chain hardening) with the human-readable tag in a
# trailing comment; Dependabot bumps the SHA and the comment together.
jobs:
  verify:
    name: Lint · Typecheck · Test · Build · Dead code · Dependency audit
    # Merged with the old standalone "quality" job: both need the full dependency install anyway,
    # and a second job paid for its own checkout + pnpm setup + install just to run
    # knip/licenses/audit after this one already did the same. One job, one install, same coverage.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # `cache: pnpm` above only restores the pnpm content-addressable STORE; node_modules is
      # rebuilt by hardlink on every run, so eslint's --cache and tsc's tsBuildInfoFile (both
      # configured to live under node_modules/.cache) started cold every time. Restore them
      # keyed on the toolchain config, so any dep/config change busts a stale entry.
      - name: Restore lint/typecheck caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.cache
          key: toolcache-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            toolcache-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'tsconfig.json') }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        # `pnpm build` is `tsc --noEmit && vite build`; the Typecheck step above already ran that
        # tsc pass and gates this one, so call the bundler directly instead of typechecking twice.
        run: pnpm exec vite build

      - name: Legal and package policy shape
        # Ordinary CI proves the files and package without granting permission to publish. The
        # release workflow supplies the final explicit authorization signal.
        run: node scripts/check-release-policy.mjs --files-only

      - name: Bundle size budget
        # Fails if the landing page's eager (gzipped) payload exceeds the budget — the byte-creep
        # backstop to the structural guard in tests/eager-bundle.test.ts. Runs against the build above.
        run: pnpm size

      - name: Public artifact boundary
        run: pnpm check:artifact

      - name: Upload production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

      - name: Dead code / unused deps (knip)
        run: pnpm knip
      - name: License gate (commercial-resale-safe deps only)
        run: pnpm check:licenses
      - name: Dependency vulnerability audit
        # npm retired the legacy endpoints used by this pnpm line. Query OSV's maintained batch
        # API against every exact package version in the installed graph instead.
        run: pnpm check:vulnerabilities

  browser-quality:
    name: Responsive · Touch · Artifacts · Slow CPU · Memory
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      # The ~130MB Chromium download was repeated on every run. Cache the browser directory,
      # keyed on the lockfile so a playwright bump fetches a matching browser. `--with-deps` stays
      # unconditional: it installs apt system libraries that live in /usr, NOT in this cache, so
      # skipping it on a cache hit would leave the browser unable to launch. The download itself is
      # already a no-op when the binary is restored.
      - name: Restore Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # These gates are BREADTH sweeps over the whole 200-block library, not per-commit regression
      # locks: the full pass is 10 widths × 2 themes of gallery mounts, ~500 reel tiles remounted
      # 24×, 10 slide skins, and 6 memory cycles over 9 routes. Running all of it on every push was
      # the second-largest line on the CI bill. A pull request gets the same gates at reduced
      # breadth (the 3 widths that actually catch layout breaks, 2 memory cycles); push-to-main and
      # the release workflow keep the exhaustive sweep, so nothing reaches a user unswept.
      # The performance probes emulate a 150ms / 1.6Mbps connection and assert a 2s shell budget,
      # and they check that no heavy asset is fetched eagerly by matching BUILT chunk names. Both
      # only mean anything against the shipped artifact: an unbundled dev server answers hundreds
      # of separate module requests under that emulation, so every surface missed its budget by
      # ~5x while doing 0ms of actual work. Build once and serve it with the real CLI — the same
      # server `npx mavea` runs — and point perf/perf:memory there. The DOM/layout audits keep
      # using the dev server, which is what they are written against.
      - name: Build the artifact the performance probes measure
        run: pnpm exec vite build
      - name: Run real-browser release gates
        shell: bash
        env:
          FULL_SWEEP: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 > /tmp/mavea-vite.log 2>&1 &
          vite_pid=$!
          node bin/mavea.mjs > /tmp/mavea-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$vite_pid" "$preview_pid" 2>/dev/null || true' EXIT
          wait_for() {
            for attempt in {1..60}; do
              if curl --fail --silent "$1" >/dev/null; then return 0; fi
              if ! kill -0 "$2" 2>/dev/null; then cat "$3"; return 1; fi
              sleep 1
            done
            cat "$3"; return 1
          }
          wait_for http://127.0.0.1:5173/ "$vite_pid" /tmp/mavea-vite.log
          wait_for http://127.0.0.1:4173/ "$preview_pid" /tmp/mavea-preview.log
          if [ -n "$FULL_SWEEP" ]; then
            pnpm audit:ui
            pnpm audit:tap
            pnpm audit:interactions -- --slow-machine
            pnpm slides:gate
            pnpm export:gate
            pnpm audit:reel
            pnpm perf -- --url http://127.0.0.1:4173 --throttle 6
            pnpm perf:memory -- --url http://127.0.0.1:4173 --cycles 6
          else
            pnpm audit:ui -- --widths 320,768,1440
            pnpm audit:tap
            pnpm audit:interactions -- --slow-machine
            pnpm perf -- --url http://127.0.0.1:4173 --throttle 6
            pnpm perf:memory -- --url http://127.0.0.1:4173 --cycles 2
          fi

  # Forward-compat only. `verify` runs every gate once, on the Node the project targets; running
  # the identical gates a second time on Node 26 answered one question — "does the toolchain still
  # work on the next major" — for the price of a full duplicate run. Ask just that question, weekly.
  node-next:
    name: Toolchain forward-compat (Node 26)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm typecheck
      - run: pnpm exec vite build

  # Also carries the Node 20 CLI smoke. GitHub bills every job rounded up to a whole minute, and
  # that check was a single `--help` invocation against a dependency-free entry point — its own
  # checkout and billed minute bought nothing. This job installs no node dependencies either, so
  # the two share a runner cleanly.
  security:
    name: Secret scan · SAST · Published CLI smoke (Node 20)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # gitleaks BINARY (pinned), not the action: the action needs a paid license for
      # organizations, and the binary is free forever on any repo — which matters on a private
      # free-plan repo. Scan the working tree (`dir`): it catches a newly-committed secret, skips
      # binary .git objects, and this job installs no deps so there's no node_modules to wade
      # through. Non-zero exit on a finding fails the job.
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact
      # Semgrep CLI + the free public `p/ci` ruleset — no login, no token, no GHAS. (The paid
      # Semgrep AppSec platform is NOT used.) pipx is preinstalled on ubuntu-latest.
      - name: Install Semgrep
        run: pipx install semgrep
      - name: SAST (Semgrep — curated CI ruleset)
        run: semgrep --config p/ci --error --quiet src gateway bin scripts vite.config.ts

      # The source toolchain requires Node 24+, but the packed CLI is dependency-free and supports
      # Node 20.19+. Exercise that public runtime contract rather than asking modern build
      # dependencies to pretend they support an older engine.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19
      - name: Exercise the dependency-free CLI entry point
        run: node bin/mavea.mjs --help

  # NOTE: Gates that are GitHub-native but need a PUBLIC repo or GitHub Advanced Security are
  # deliberately omitted on this private free-plan repo (they'd just error): CodeQL code scanning,
  # dependency-review-action (needs the Dependency Graph), and OpenSSF Scorecard. Add them the day
  # the repo goes public — they're free then.

  commit-messages:
    name: Commit messages (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # The dedicated action bundles its own commitlint install — no need to pnpm-install the
      # whole monorepo just to lint commit message text.
      - name: Lint the PR's commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
