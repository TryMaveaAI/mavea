name: CI

# Every job in this file runs on every trigger of this file — that invariant is why the checks
# list on a push shows only green rows, never "Skipped". Work with other cadences lives in its
# own workflow: weekly.yml (browser gauntlet + Node-next forward-compat, schedule/manual),
# commits.yml (Conventional Commits lint, PRs), release.yml (the exhaustive ship gate).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs to save resources, but NEVER cancel a push to main — a quick second
# push must not kill the first run (and its uploaded artifact) mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; each job re-declares exactly what it needs.
permissions:
  contents: read

# Actions are pinned to a commit SHA (supply-chain hardening) with the human-readable tag in a
# trailing comment; Dependabot bumps the SHA and the comment together.
jobs:
  verify:
    name: Lint · Typecheck · Build
    # Merged with the old standalone "quality" job: both need the full dependency install anyway,
    # and a second job paid for its own checkout + pnpm setup + install just to run
    # knip/licenses/audit after this one already did the same. One job, one install, same coverage.
    #
    # The dependency vulnerability audit also runs weekly because advisories can change with no
    # repository diff. Change-sensitive legal, licence, and package gates stay here so a docs-only
    # or dependency PR cannot bypass them.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # `cache: pnpm` above only restores the pnpm content-addressable STORE; node_modules is
      # rebuilt by hardlink on every run, so eslint's --cache and tsc's tsBuildInfoFile (both
      # configured to live under node_modules/.cache) started cold every time. Restore them
      # keyed on the toolchain config, so any dep/config change busts a stale entry.
      - name: Restore lint/typecheck caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.cache
          key: toolcache-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            toolcache-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'tsconfig.json') }}-

      # Vite/Vitest pre-bundles this project's dependency graph (openchemlib, pdfjs-dist,
      # playwright, leaflet, katex, shiki, and the rest) from scratch on every cold invocation —
      # measured at ~500s of FIXED cost paid identically whether one file or the whole suite runs,
      # independent of node_modules/.cache above (that one covers eslint/tsc, not Vite's own
      # optimizeDeps store). Shared across this job and every test shard below via the same key.
      - name: Restore Vite dependency pre-bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.vite
          key: vite-deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        # `pnpm build` is `tsc --noEmit && vite build`; the Typecheck step above already ran that
        # tsc pass and gates this one, so call the bundler directly instead of typechecking twice.
        run: pnpm exec vite build

      - name: Legal and package policy shape
        # Ordinary CI proves the files and package without granting permission to publish. The
        # release workflow supplies the final explicit authorization signal.
        run: node scripts/check-release-policy.mjs --files-only

      - name: Bundle size budget
        # Fails if the landing page's eager (gzipped) payload exceeds the budget — the byte-creep
        # backstop to the structural guard in tests/eager-bundle.test.ts. Runs against the build above.
        run: pnpm size

      - name: Public artifact boundary
        run: pnpm check:artifact

  # Tests are sharded for wall-clock latency. Public-repository ubuntu-latest is a standard hosted
  # runner (currently 4 vCPU / 16GB), which GitHub documents as free and unlimited; no larger or
  # paid runner label is used. The build is not uploaded because no later job consumes it, avoiding
  # unnecessary artifact storage.
  test:
    name: Test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Same fixed-cost problem as the verify job above, paid by EVERY shard independently — this
      # is why all 4 shards took ~10-11min despite each running only 1/4 of the files. Restoring
      # the same cache key here lets a shard reuse whichever shard (or the verify job) populated
      # it first; on a cache hit this collapses most of that fixed cost to near zero.
      - name: Restore Vite dependency pre-bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.vite
          key: vite-deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}

      - name: Test (shard ${{ matrix.shard }}/4)
        run: pnpm test -- --shard=${{ matrix.shard }}/4

  # Also carries the Node 20 CLI smoke. Keeping the dependency-free check here avoids another
  # checkout and runner while preserving the published engine contract.
  security:
    name: Secret scan · SAST · Published CLI smoke (Node 20)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Use the open-source scanner binary directly and verify its publisher checksum before
      # execution. Scan the working tree (`dir`): it catches a newly committed secret, skips binary
      # .git objects, and this job installs no project dependencies.
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --no-banner --redact
      # Semgrep CLI + the free public `p/ci` ruleset — no login, no token, no GHAS. (The paid
      # Semgrep AppSec platform is NOT used.) pipx is preinstalled on ubuntu-latest.
      - name: Install Semgrep
        run: pipx install semgrep==1.172.0
      - name: SAST (Semgrep — curated CI ruleset)
        run: semgrep --config p/ci --error --quiet src gateway bin scripts vite.config.ts

      # The source toolchain requires Node 24+, but the packed CLI is dependency-free and supports
      # Node 20.19+. Exercise that public runtime contract rather than asking modern build
      # dependencies to pretend they support an older engine.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19
      - name: Exercise the dependency-free CLI entry point
        run: node bin/mavea.mjs --help

  # Public-repository native security checks live in dedicated workflows: CodeQL and Scorecard run
  # on pushes/schedules, while Dependency Review runs only where it has a PR diff to inspect.
