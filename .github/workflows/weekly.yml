name: Weekly sweep

# The checks that don't belong on every push, on their own cadence so ci.yml's
# per-push checks list never carries a "Skipped" row. Trigger by hand after a change that touches
# layout, reels, or the perf budgets: Actions tab → Weekly sweep → Run workflow, or
# `gh workflow run weekly.yml`.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Moved off ci.yml's per-push path: none of these three depend on THIS push's code — they drift
  # with dependencies over time (a previously-clean package can grow a new CVE with zero code
  # change here), so a weekly cadence catches drift that per-push gating on an unchanged lockfile
  # never would anyway. A dependency bump PR still exercises these via this same job on-demand.
  dependency-hygiene:
    name: Dead code · License gate · Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Dead code / unused deps (knip)
        run: pnpm knip
      - name: License gate (commercial-resale-safe deps only)
        run: pnpm check:licenses
      - name: Dependency vulnerability audit
        # npm retired the legacy endpoints used by this pnpm line. Query OSV's maintained batch
        # API against every exact package version in the installed graph instead.
        run: pnpm check:vulnerabilities

  browser-quality:
    name: Responsive · Touch · Artifacts · Slow CPU · Memory
    # Weekly + on-demand, NOT per-push. Two reasons, both learned the expensive way:
    #
    # Resource use — this is the longest job (~9-15 min of Playwright driving 625 gallery tiles,
    # ~500 reel remounts, and the perf/memory probes), so weekly plus on-demand gives useful broad
    # coverage without burning compute on unrelated pushes. Standard public-repository runners are
    # free; no paid or larger runner is selected.
    #
    # Determinism — its checks measure RENDERED GEOMETRY, so a verdict can flip on a 1px platform
    # font difference (claimgrid tripped at 390px on one run and passed the next, byte-identical
    # tree). A gate that can go red without a code change cannot be a per-push gate; as a weekly
    # sweep a marginal finding is a report to act on, not a blocked push.
    #
    # release.yml verifies that CI is green on the exact source commit before cutting a version.
    # The releaser should also confirm this scheduled sweep is current when a layout, reel, export,
    # or performance change is in scope.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      # The ~130MB Chromium download was repeated on every run. Cache the browser directory,
      # keyed on the lockfile so a playwright bump fetches a matching browser. `--with-deps` stays
      # unconditional: it installs apt system libraries that live in /usr, NOT in this cache, so
      # skipping it on a cache hit would leave the browser unable to launch. The download itself is
      # already a no-op when the binary is restored.
      - name: Restore Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # `--throttle 1` here is not a relaxation. The flag simulates a slow DEVICE by dividing a
      # developer laptop's CPU, and its budgets are calibrated for that. A 2-core cloud runner is
      # already that slow device — throttling it a further 6x models hardware no user owns, and the
      # numbers said exactly that: 2088ms to a 2000ms shell budget, with the same commit at 1513ms
      # locally. Let the runner be the slow machine and keep the budgets meaningful.
      #
      # The performance probes emulate a 150ms / 1.6Mbps connection and assert a 2s shell budget,
      # and they check that no heavy asset is fetched eagerly by matching BUILT chunk names. Both
      # only mean anything against the shipped artifact: an unbundled dev server answers hundreds
      # of separate module requests under that emulation, so every surface missed its budget by
      # ~5x while doing 0ms of actual work. Build once and serve it with the real CLI — the same
      # server `npx mavea` runs — and point perf/perf:memory there. The DOM/layout audits keep
      # using the dev server, which is what they are written against.
      - name: Build the artifact the performance probes measure
        run: pnpm exec vite build
      - name: Run real-browser release gates
        shell: bash
        run: |
          # NOTE: deliberately not `set -e`. These gates are independent checks, and aborting at
          # the first failure means one run can only ever reveal one problem — the next is hidden
          # until the first is fixed and the whole job re-run. That is how five of these gates went
          # years without executing at all: audit:ui failed first, every time, and masked the rest.
          # Run them all, then fail once with the full list. One run, one complete picture.
          set -uo pipefail
          pnpm exec vite --host 127.0.0.1 > /tmp/mavea-vite.log 2>&1 &
          vite_pid=$!
          node bin/mavea.mjs > /tmp/mavea-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$vite_pid" "$preview_pid" 2>/dev/null || true' EXIT
          wait_for() {
            for attempt in {1..60}; do
              if curl --fail --silent "$1" >/dev/null; then return 0; fi
              if ! kill -0 "$2" 2>/dev/null; then cat "$3"; return 1; fi
              sleep 1
            done
            cat "$3"; return 1
          }
          # A server that never came up is different: nothing downstream can mean anything, so stop.
          wait_for http://127.0.0.1:5173/ "$vite_pid" /tmp/mavea-vite.log || exit 1
          wait_for http://127.0.0.1:4173/ "$preview_pid" /tmp/mavea-preview.log || exit 1

          failed=()
          gate() {
            local name="$1"; shift
            echo "::group::gate: $name"
            if "$@"; then
              echo "✓ $name"
            else
              echo "✗ $name"
              failed+=("$name")
            fi
            echo "::endgroup::"
          }

          gate audit:ui           pnpm audit:ui -- --widths 280,390,768,1280,1920 --variants all
          # audit:surfaces used to run here. It sweeps every reader-facing surface, and that list
          # went from 9 to 16 — Prism, Synthesis, the dashboards, the decks, the courses and the
          # course reader had never been measured — which is 272 combinations and no longer fits
          # beside a 24-minute block sweep. It has its own job below rather than a bigger budget
          # here: the two are independent, so running them in parallel costs wall-clock nothing.
          gate audit:tap          pnpm audit:tap
          gate audit:interactions pnpm audit:interactions -- --slow-machine
          gate slides:gate        pnpm slides:gate
          gate export:gate        pnpm export:gate
          gate audit:reel         pnpm audit:reel
          gate perf               pnpm perf -- --url http://127.0.0.1:4173 --throttle 1
          gate perf:memory        pnpm perf:memory -- --url http://127.0.0.1:4173 --cycles 6
          # The living world's two instruments moved to their own job below. audit:world sweeps the
          # whole scenario corpus in both themes and is roughly half an hour on its own, which this
          # job could not absorb beside a 24-minute block sweep: the run was killed at 35 minutes
          # having just reached it, so the world went unmeasured while everything else had passed.

          if [ ${#failed[@]} -gt 0 ]; then
            echo ""
            echo "Failing gates (${#failed[@]}): ${failed[*]}"
            exit 1
          fi
          echo ""
          echo "All browser release gates passed."

  # The living world, on its own runner. Both instruments drive the dev-only #/worldlab, so they
  # need a dev server; and audit:world sweeps the whole scenario corpus in both themes, which is
  # roughly half an hour by itself. Sharing browser-quality's 35 minutes meant it was reached and
  # then killed — the worst outcome, because a cancelled job reports nothing at all.
  world-sweep:
    name: Living world · corpus + slow machine
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Restore Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Restore Vite dependency pre-bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.vite
          key: vite-devdeps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}
      - name: Sweep the world
        shell: bash
        run: |
          # Not `set -e`: the smoke is worth running even when the corpus sweep finds something.
          set +e
          set -uo pipefail
          pnpm exec vite --host 127.0.0.1 --strictPort > /tmp/mavea-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for _ in {1..60}; do
            curl --fail --silent http://127.0.0.1:5173/ >/dev/null && break
            if ! kill -0 "$vite_pid" 2>/dev/null; then cat /tmp/mavea-vite.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/src/main.tsx >/dev/null || {
            cat /tmp/mavea-vite.log; exit 1; }

          failed=()
          gate() {
            local name="$1"; shift
            echo "::group::gate: $name"
            if "$@"; then echo "✓ $name"; else echo "✗ $name"; failed+=("$name"); fi
            echo "::endgroup::"
          }
          gate audit:world pnpm audit:world -- --url http://127.0.0.1:5173 --theme dark,light
          # One world in a SHORT window — where the camera sits lowest and the layout costs most.
          #
          # NOT `world:smoke`, which hardcodes `--throttle=4`. world-perf's budgets are fixed
          # constants calibrated on a developer laptop, and they do not scale with the flag, so on
          # a 2-core runner that is a slow machine divided by four measured against a fast
          # machine's numbers. It is the same mistake the perf gate above documents and avoids:
          # let the runner be the slow machine and keep the budget meaningful. Measured at ×4 on
          # CI it missed by 11ms — 211ms worst task against 200 — while blocking passed at 286/300.
          gate world:smoke \
            pnpm perf:world -- --url http://127.0.0.1:5173 --viewport=1280x720 --throttle=1
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failing gates (${#failed[@]}): ${failed[*]}"
            exit 1
          fi
          echo "World gates clean."

  # The rooms the cards sit in, not the cards: the block sweep cannot see a reading column
  # squeezed to a porthole, a panel with no way to scroll it, or a control stranded off the edge.
  # Its own job because it is its own axis — every surface and lab × 13 widths × 1× and two zooms ×
  # both themes — and because sharing browser-quality's runner made that job overrun a 35-minute
  # budget and get killed mid-sweep, which reports as "cancelled" and tells nobody anything.
  #
  # responsive.yml already runs the per-push subset (`--ci`: five block widths, four surface sizes,
  # one zoom, dark). This is the full matrix: every width on the ladder, both zooms, the light
  # theme and the dev-only labs — with the block library left to browser-quality above, which
  # already sweeps it in all three data variants.
  surface-sweep:
    name: Surfaces · every size, every zoom, both themes
    runs-on: ubuntu-latest
    # Measured: ~900 combinations at roughly 5s each plus per-surface settle time, on a runner
    # several times slower than the laptop the local figure came from.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Restore Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Restore Vite dependency pre-bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.vite
          key: vite-devdeps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}
      # The suite starts vite itself and waits for a module to be served (index.html is static and
      # answers before optimizeDeps is ready) — one command, never a split stack.
      - name: Sweep every surface, every size, every zoom, both themes
        run: pnpm audit:responsive -- --no-ui

  # Forward-compat only. Per-push CI runs every gate once, on the Node the project targets;
  # running the identical gates a second time on Node 26 answered one question — "does the
  # toolchain still work on the next major" — for the price of a full duplicate run. Ask just
  # that question, weekly.
  node-next:
    name: Toolchain forward-compat (Node 26)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm typecheck
      - run: pnpm exec vite build
