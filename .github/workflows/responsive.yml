name: Responsive gate

# The geometry suite, on every push that can change layout.
#
# It used to run only in weekly.yml, and that is why breakage reached readers instead of CI: a
# regression could sit on main for seven days, by which point the diff is large and a finding is
# cheap to wave through. The block library and every surface are clean today; keeping them clean
# is a per-push job.
#
# weekly.yml gave two reasons for not doing this, and both are answered rather than ignored:
#
#   Determinism — its checks measure RENDERED GEOMETRY, so a verdict could flip on a 1px platform
#   font difference. scripts/launch-chromium.mts now disables hinting, subpixel positioning and
#   LCD text, which is what made glyph metrics vary between runs. Measured after that change: the
#   same commit audited three times returns identical verdicts. It is a reduction in variance, not
#   a proof — ubuntu-latest is a rolling image, so a fontconfig or font-package bump can still move
#   metrics with no code change. That is the case to re-measure against, not to pre-empt here.
#
#   Cost — the full sweep is every width on the ladder at 1× and two zooms, both themes, every
#   surface and lab, plus all 625 tiles in three variants. This runs `pnpm audit:responsive --ci`:
#   the block library at five widths and the surfaces at the narrowest phone, a tablet, the short
#   laptop (also zoomed to 125%) and a desktop, dark only — the shapes a regression most often
#   reaches readers at. The full matrix, the light theme and the labs stay weekly.
#
# The suite also screenshots every surface × size × zoom into .audit-out/ for a person to look at
# when a run is red. Nothing compares them: the verdict is geometry, so a font bump on the runner
# image cannot flip it. They are NOT uploaded — the repo keeps CI on free standard runners with no
# billable artifact storage (tests/build-supply-chain-policy.test.ts pins that) — so on CI the
# report is the log, and the pictures are one `pnpm audit:responsive -- --ci` away locally.
#
# Every job in this file runs on every trigger of it — a different cadence is a different file.
on:
  push:
    # main only, matching ci.yml. Without it a feature branch matches BOTH this and the
    # pull_request trigger, and the concurrency groups cannot dedupe them (refs/heads/foo vs
    # refs/pull/N/merge), so every push to an open PR would run this whole job twice.
    branches: [main]
    # Duplicated rather than shared with a YAML anchor: anchors are valid YAML but GitHub's
    # workflow parser does not resolve them, so the alias would silently become an empty filter.
    paths:
      - 'src/**/*.css'
      - 'src/**/*.tsx'
      - 'src/**/*.ts'
      # The font files and the preloads that fetch them: swapping a face moves every metric these
      # gates measure, with no diff under src/.
      - 'index.html'
      - 'public/fonts/**'
      - 'vite.config.ts'
      # A Playwright or renderer bump changes glyph metrics with an empty src/ diff.
      - 'pnpm-lock.yaml'
      - 'scripts/ui-audit.mts'
      - 'scripts/surface-audit.mts'
      - 'scripts/surface-sweep.mjs'
      - 'scripts/responsive-audit.mts'
      - 'scripts/dev-server.mts'
      - 'scripts/launch-chromium.mts'
      - '.github/workflows/responsive.yml'
  pull_request:
    paths:
      - 'src/**/*.css'
      - 'src/**/*.tsx'
      - 'src/**/*.ts'
      # The font files and the preloads that fetch them: swapping a face moves every metric these
      # gates measure, with no diff under src/.
      - 'index.html'
      - 'public/fonts/**'
      - 'vite.config.ts'
      # A Playwright or renderer bump changes glyph metrics with an empty src/ diff.
      - 'pnpm-lock.yaml'
      - 'scripts/ui-audit.mts'
      - 'scripts/surface-audit.mts'
      - 'scripts/surface-sweep.mjs'
      - 'scripts/responsive-audit.mts'
      - 'scripts/dev-server.mts'
      - 'scripts/launch-chromium.mts'
      - '.github/workflows/responsive.yml'
  workflow_dispatch:

concurrency:
  group: responsive-${{ github.ref }}
  # Never cancel a push to main — that commit's check would be left cancelled, which reads the
  # same as "never ran". Superseding a PR's own earlier run is free. (ci.yml states this rule.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  responsive:
    name: Responsive · blocks · surfaces
    runs-on: ubuntu-latest
    # Measured end to end on a developer laptop: audit:ui at five widths is ~220s and the surfaces
    # at four sizes plus one zoom ~260s, so ~8 min of gate. The rest of the budget is checkout,
    # install, the Chromium fetch on a cache miss, and a runner slower than a laptop.
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Restore Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # `--with-deps` stays unconditional: it installs apt libraries in /usr, which the cache above
      # does not hold, so skipping it on a cache hit leaves the browser unable to launch.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # The suite starts the DEV server itself, so this job pays Vite's optimizeDeps pass — ~500s
      # cold, per ci.yml. Its OWN key, deliberately: ci.yml's `vite-deps-*` cache is written by jobs
      # that never populate deps/, and actions/cache skips the save on an exact key hit, so sharing
      # the key would restore an empty cache forever and never write a useful one.
      - name: Restore Vite dependency pre-bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.vite
          key: vite-devdeps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}
      # One command, never a split stack: the script starts vite on its own port, waits for a
      # module to be served (index.html is static and answers before the optimiser is ready), runs
      # the block sweep and the surface sweep, and fails once with the full list rather than at the
      # first finding — so one run reveals every problem, not just the first.
      - name: Run the geometry suite (per-push subset)
        run: pnpm audit:responsive -- --ci --verbose
