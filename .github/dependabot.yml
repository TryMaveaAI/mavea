version: 2
updates:
  - package-ecosystem: npm # reads pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Lowercase Conventional-Commit prefixes so Dependabot PRs pass commitlint/CI.
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    # Patch/minor only — major action bumps are reviewed and applied manually.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
